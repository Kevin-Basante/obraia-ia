[project]
name = "obraia-ia"
version = "1.0.0"
description = "ObraIA AI service: reads construction blueprints and returns measurements"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI declares dependencies with Depends() and File() in the arguments.
ignore = ["B008"]
